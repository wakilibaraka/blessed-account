name: blessed_account
description: Shared sign-in and account management for The Blessed Bible and Blessed Arcade.
version: 0.3.0
publish_to: 'none'
repository: https://github.com/wakilibaraka/blessed-account

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  flutter_riverpod: ^3.3.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
